spring.application.name=pokedex-api
server.port=${PORT:8080}

# Lê variáveis de um arquivo .env na pasta backend, se ele existir (não é versionado).
spring.config.import=optional:file:.env[.properties]

# Conexão com o MongoDB. A URI real (ex.: MongoDB Atlas) vem da variável de ambiente MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
spring.mongodb.database=${MONGODB_DATABASE:pokedex}

# Importação do Script_Pokedex.sql para o MongoDB (só quando a coleção "pokemons" está vazia).
pokedex.seed.enabled=${POKEDEX_SEED_ENABLED:true}
pokedex.seed.reset=${POKEDEX_SEED_RESET:false}
